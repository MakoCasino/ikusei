<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>会員登録 - まこと育成ゲーム</title>
  <script type="module" src="register.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>会員登録</h1>
    <input type="text" id="register-id" placeholder="ID（5文字以上）" />
    <input type="password" id="register-password" placeholder="パスワード（8文字以上）" />
    <button id="register-btn">登録する</button>
    <p>
      アカウント作成済みの方は <a href="login.html">こちら</a>
    </p>
    <p id="register-error" class="error-message"></p>
  </div>
</body>
</html>
