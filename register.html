<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>会員登録 - まこと育成ゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>会員登録</h1>
    <input type="text" id="register-id" placeholder="ID（5文字以上）" />
    <input type="password" id="register-password" placeholder="パスワード（8文字以上）" />
    <button id="register-btn">登録する</button>
    <p>
      アカウント作成済みの方は <a href="login.html">こちら</a>
    </p>
    <p id="register-error" class="error-message"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js";

    // Firebase設定
    const firebaseConfig = {
      apiKey: "AIzaSyDR2yB8Rj48CW_FsvQWbzszzVqO8g2ZkGA",
      authDomain: "makoto-casi.firebaseapp.com",
      projectId: "makoto-casi",
      storageBucket: "makoto-casi.firebasestorage.app",
      messagingSenderId: "288373107326",
      appId: "1:288373107326:web:9c5c6279611c46438ec62f",
      measurementId: "G-SJ6KF9L3N7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 登録ボタン押されたとき
    document.getElementById("register-btn").addEventListener("click", async () => {
      const id = document.getElementById("register-id").value;
      const password = document.getElementById("register-password").value;
      const errorMsg = document.getElementById("register-error");

      // バリデーションチェック
      if (id.length < 5 || password.length < 8) {
        errorMsg.textContent = "IDは5文字以上、パスワードは8文字以上にしてください。";
        return;
      }

      // Firebase認証用に仮のメール形式にする（例: user123@makoto.com）
      const email = id + "@makoto.com";

      try {
        // Firebase Auth 登録
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // Firestoreに初期チップとステージ保存
        await setDoc(doc(db, "users", user.uid), {
          chips: 0,
          lastBonusStage: null,
          createdAt: serverTimestamp()
        });

        // 成功したらログインページへ
        window.location.href = "login.html";

      } catch (error) {
        errorMsg.textContent = "登録に失敗しました：" + error.message;
      }
    });
  </script>
</body>
</html>
