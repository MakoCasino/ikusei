<!DOCTYPE html>
<html lang="ja">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ログイン - まこと育成ゲーム</title>
  <script type="module" src="login.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
